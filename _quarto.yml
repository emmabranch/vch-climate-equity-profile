project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - briefing.qmd
  resources:
    - .nojekyll
    - images/motif.svg

website:
  title: "VCH Climate Resilience and Equity Profile"
  favicon: images/favicon.png
  navbar:
    logo: images/motif.svg
    logo-alt: ""
    left:
      - href: index.qmd
        text: Map
      - href: briefing.qmd
        text: Briefing
    right:
      - icon: github
        href: https://github.com/emmabranch/vch-climate-equity-profile
  page-footer:
    center: "Independent portfolio project by Emma Branch. Not affiliated with or endorsed by Vancouver Coastal Health."

format:
  html:
    theme: [cosmo, brand, brand.scss, theme.scss]
    include-after-body: footer.html
    toc: false

execute:
  echo: false
  warning: false
  message: false
